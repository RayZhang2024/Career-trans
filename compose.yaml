name: career-trans-local

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/career_agent.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-compose-secret}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      CV_SEMANTIC_EXTRACTION_MODEL: ${CV_SEMANTIC_EXTRACTION_MODEL:-gpt-5.6-luna}
      CANDIDATE_ADVISER_MODEL: ${CANDIDATE_ADVISER_MODEL:-gpt-5.6-luna}
      JOB_EXTRACTION_MODEL: ${JOB_EXTRACTION_MODEL:-gpt-5.6-luna}
      REQUIREMENT_MATCHING_MODEL: ${REQUIREMENT_MATCHING_MODEL:-gpt-5.6-luna}
      CAREER_ALIGNMENT_MODEL: ${CAREER_ALIGNMENT_MODEL:-gpt-5.6-luna}
      JOB_RELEVANCE_MODEL: ${JOB_RELEVANCE_MODEL:-gpt-5.6-luna}
      JOB_ARCHETYPE_MODEL: ${JOB_ARCHETYPE_MODEL:-gpt-5.6-luna}
      AGENTIC_DISCOVERY_MODEL: ${AGENTIC_DISCOVERY_MODEL:-gpt-5.6-luna}
      APPLICATION_DRAFTING_MODEL: ${APPLICATION_DRAFTING_MODEL:-gpt-5.6-luna}
      CV_SEMANTIC_EXTRACTION_REASONING_EFFORT: ${CV_SEMANTIC_EXTRACTION_REASONING_EFFORT:-}
      CANDIDATE_ADVISER_REASONING_EFFORT: ${CANDIDATE_ADVISER_REASONING_EFFORT:-}
      JOB_EXTRACTION_REASONING_EFFORT: ${JOB_EXTRACTION_REASONING_EFFORT:-}
      REQUIREMENT_MATCHING_REASONING_EFFORT: ${REQUIREMENT_MATCHING_REASONING_EFFORT:-}
      CAREER_ALIGNMENT_REASONING_EFFORT: ${CAREER_ALIGNMENT_REASONING_EFFORT:-}
      JOB_RELEVANCE_REASONING_EFFORT: ${JOB_RELEVANCE_REASONING_EFFORT:-}
      JOB_ARCHETYPE_REASONING_EFFORT: ${JOB_ARCHETYPE_REASONING_EFFORT:-}
      AGENTIC_DISCOVERY_REASONING_EFFORT: ${AGENTIC_DISCOVERY_REASONING_EFFORT:-}
      APPLICATION_DRAFTING_REASONING_EFFORT: ${APPLICATION_DRAFTING_REASONING_EFFORT:-}
      AGENTIC_SEARCH_PROVIDER: ${AGENTIC_SEARCH_PROVIDER:-disabled}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - career_agent_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  career_agent_data:
