name: career-trans-local

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/career_agent.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-compose-secret}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      AGENTIC_SEARCH_PROVIDER: ${AGENTIC_SEARCH_PROVIDER:-disabled}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - career_agent_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  career_agent_data:
